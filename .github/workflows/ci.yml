name: CI

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]

permissions:
    contents: read

env:
    XDEBUG_MODE: coverage

jobs:
    backend:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    -   php-versions: '8.4'
                        composer-prefer: ''
                        symfony-require: ''
                    -   php-versions: '8.4'
                        composer-prefer: '--prefer-lowest'
                        symfony-require: '6.4.*'

        steps:
            -   uses: actions/checkout@v6

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: xdebug
                    extensions: gd
                    ini-values: "post_max_size=256M"

            -   name: Check PHP Version
                run: php -v

            -   name: Validate composer.json and composer.lock
                run: composer validate --strict

            -   name: Get Composer cache directory
                id: composer-cache-dir
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v5
                with:
                    path: ${{ steps.composer-cache-dir.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ matrix.composer-prefer }}-${{ hashFiles('composer.json') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php-versions }}-

            -   name: Install dependencies
                run: |
                    if [ -n "${{ matrix.symfony-require }}" ]; then
                        composer global config --no-plugins allow-plugins.symfony/flex true
                        composer global require symfony/flex:^2.8 --prefer-dist --no-interaction --no-progress --prefer-stable
                        export SYMFONY_REQUIRE="${{ matrix.symfony-require }}"
                    fi

                    COMPOSER_ROOT_VERSION=6.0.x-dev composer update --prefer-dist --no-interaction --no-progress --prefer-stable ${{ matrix.composer-prefer }}

            -   name: Run package validation
                run: composer run-tests

            -   name: Check coverage report
                id: coverage_report
                run: |
                    if [ -f clover.xml ]; then
                        echo "has_clover=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "has_clover=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Upload coverage to Codecov
                if: matrix.composer-prefer == '' && steps.coverage_report.outputs.has_clover == 'true'
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    files: clover.xml

    frontend:
        needs: backend
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-versions: [ '20' ]
                npm-versions: [ '10' ]

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: ${{ matrix.node-versions }}

            -   name: Check Node.js Version
                run: node -v

            -   name: Check npm Version
                run: npm -v

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: assets/node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json', 'assets/package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                working-directory: assets
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Run build script
                working-directory: assets
                run: npm run build

    build-dist:
        needs: frontend
        runs-on: ubuntu-latest
        permissions:
            contents: write

        env:
            CI_COMMIT_MESSAGE: Continuous Integration Assets Build Artifacts
            CI_COMMIT_AUTHOR: Continuous Integration
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ env.BRANCH_NAME }}

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '20'

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: assets/node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json', 'assets/package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                working-directory: assets
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Build dist
                working-directory: assets
                run: npm run build

            -   name: Check dist is clean on pull requests
                if: github.event_name == 'pull_request'
                run: |
                    if [ -n "$(git status --porcelain -- assets/dist)" ]; then
                        git status --short -- assets/dist
                        exit 1
                    fi

            -   name: Commit dist changes
                if: github.event_name == 'push'
                run: |
                    if [ -z "$(git status --porcelain -- assets/dist)" ]; then
                        exit 0
                    fi

                    git config user.name "${{ env.CI_COMMIT_AUTHOR }}"
                    git config user.email "username@users.noreply.github.com"
                    git add assets/dist
                    git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
                    git push origin HEAD:${{ env.BRANCH_NAME }}
