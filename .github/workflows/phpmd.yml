name: Code Scanning

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]
    schedule:
        -   cron: '35 13 * * 4'

permissions:
    contents: read

jobs:
    PHPMD:
        name: Run PHPMD SARIF scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup PHP and PHPMD
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none
                    tools: phpmd:3.0.0

            -   name: Run PHPMD
                run: phpmd analyze src --format sarif --ruleset .phpmd.xml.dist --reportfile-sarif phpmd-results.sarif --threads 2 --no-progress
                continue-on-error: true

            -   name: Validate SARIF report
                id: validate_sarif
                if: always()
                run: |
                    if [ ! -s phpmd-results.sarif ]; then
                        echo "valid=false" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi

                    if jq empty phpmd-results.sarif; then
                        echo "valid=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "valid=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Upload analysis results to GitHub
                if: steps.validate_sarif.outputs.valid == 'true'
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: phpmd-results.sarif
                    wait-for-processing: true
