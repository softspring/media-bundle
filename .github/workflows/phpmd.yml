# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# PHPMD is a spin-off project of PHP Depend and
# aims to be a PHP equivalent of the well known Java tool PMD.
# What PHPMD does is: It takes a given PHP source code base
# and look for several potential problems within that source.
# These problems can be things like:
#   Possible bugs
#   Suboptimal code
#   Overcomplicated expressions
#   Unused parameters, methods, properties
# More details at https://phpmd.org/

name: Code Quality

on:
    push:
        branches: [ "6.0" ]
    pull_request:
        branches: [ "6.0" ]
    schedule:
        -   cron: '35 13 * * 4'

permissions:
    contents: read

jobs:
    PHPMD:
        name: Run PHPMD scanning
        runs-on: ubuntu-latest
        permissions:
            contents: read # for checkout to fetch code
            security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
            actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
        strategy:
            matrix:
                php-versions: [ '8.4' ]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@aa1fe473f9c687b6fb896056d771232c0bc41161
                with:
                    php-version: ${{ matrix.php-versions }}
                    coverage: none
                    tools: phpmd

            -   name: Run PHPMD
                run: phpmd src sarif .phpmd.xml.dist --reportfile phpmd-results.sarif
                continue-on-error: true

            -   name: Validate SARIF output
                id: validate_sarif
                run: |
                    if [ -f phpmd-results.sarif ] && jq empty phpmd-results.sarif >/dev/null 2>&1; then
                      echo "has_sarif=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "has_sarif=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Upload analysis results to GitHub
                if: steps.validate_sarif.outputs.has_sarif == 'true'
                uses: github/codeql-action/upload-sarif@v3
                with:
                    sarif_file: phpmd-results.sarif
                    wait-for-processing: true
