admin_medias:
    modal:
        title: "Select media"
        actions:
            close: "Close"
            select: "Select"
        filter:
            title: "Choose a media from the list or upload a new media"
    list:
        meta.title: "Medias"
        title: "Medias"
        breadcrumb: "Medias"
        empty:
            no_types_configured:
                message_raw: "No media types have been configured"
                go_to_doc_raw: "Check how to configure media types at <a href=\"https://github.com/softspring/media-bundle\" target=\"_blank\">documentation</a>"
            create_first_raw: "No files have been uploaded yet, click on the \"New media\" button to upload one."
            clean_filters_raw: "No results found, try to be less restrictive."
        actions:
            create.link: "New media"
        filter_form:
            text:
                label: "Text"
                placeholder: "Enter text"
            name:
                label: "File name"
                placeholder: "Enter file name"
            type:
                label: "Media type"
                placeholder: "Select media type"
            no_content_entity:
                label: "Not used in content"
            with_duplicates:
                label: "With duplicates"
            content_entity:
                label: "Content"
                placeholder: "Select content"
            order_field:
                name: "Name"
                createdAt: "Creation date"
            ordir_field:
                asc: "Ascending"
                desc: "Descending"

    create:
        meta.title: "%type%"
        title: "%type%"
        breadcrumb: "Add new media"
        form_title: "Add new media"
        actions:
            create.button: "Upload media"
            cancel.button: "Cancel"
            upload.button: "Select main media"

    read:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Details"
        actions:
            update.button: "Update media"
            delete.button: "Delete media"
            migrate.button: "Migrate configuration"

    delete:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Delete media"
        message: "Are you sure you want to delete this media?"
        warning:
            title: "Are you sure you want to delete this media?"
            text: "This will permanently remove the files. If the file URLs are hardcoded anywhere, the links will break."
        actions:
            delete.button: "Delete media"
            cancel.button: "Cancel"
        success_flash: "Media deleted successfully"
        failure_flash: "Media deletion failed.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Media deletion failed.<br/><small>%exception%</small><br/><small>%previous%</small>"

    update:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Update media"
        actions:
            update.button: "Save changes"
            cancel.button: "Cancel"
            delete.button: "Delete"
        success_flash: "Media updated successfully"
        failure_flash: "Media update failed.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Media update failed.<br/><small>%exception%</small><br/><small>%previous%</small>"

    migrate:
        success_flash: "Media migrated successfully"
        failure_flash: "Media migration failed.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Media migration failed.<br/><small>%exception%</small><br/><small>%previous%</small>"

    form:
        name.label: "Name"
        description.label: "Description"
        altTexts.label: "Alternative texts"
        _original.label: "Main media"
        upload.label: "File"
        instructions: "Drag & drop your file here or upload it using the button."
        button: "Select file"
        upload_requirements:
            title: "Requirements"
            minWidth: "min width %value%"
            maxWidth: "max width %value%"
            minHeight: "min height %value%"
            maxHeight: "max height %value%"
            mimeTypes: "allowed formats %value%"
            maxSize: "max file size %value%"
            binaryFormat.true: "binary format allowed"
            binaryFormat.false: "binary format not allowed"
            allowSquare.true: "square media allowed"
            allowSquare.false: "square media not allowed"
            allowLandscape.true: "landscape media allowed"
            allowLandscape.false: "landscape media not allowed"
            allowPortrait.true: "portrait media allowed"
            allowPortrait.false: "portrait media not allowed"

    alerts:
        media_new_versions_raw: "Missing <strong>%version%</strong> version in this media, seems to be a <strong>new version</strong> in config. You need to run media migrations command."
        media_delete_versions_raw: "Media <strong>%version%</strong> version has been <strong>deleted</strong> in config. You need to run media migrations command to cleanup medias."
        media_changed_versions_raw: "<strong>%version%</strong> version configuration has been <strong>changed</strong> (%change_list%). You need to run media migrations command to cleanup medias."
        media_manual_versions_raw: "Missing <strong>%version%</strong> version in this media, seems to be <strong>new</strong> in config. It's mandatory that you provide this file manually."
        media_duplicates_raw: "%duplicates% duplicates of this media. <a href=\"%url%\">View list</a>"
        total_duplicates_raw: "There are %different% medias with some duplicates. A total of %total% medias are affected, so there are %duplicates% medias that are potentially duplicated and they can be deleted."
