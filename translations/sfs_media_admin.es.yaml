admin_medias:
    modal:
        title: "Selecciona un media"
        actions:
            close: "Cerrar"
            select: "Seleccionar"
        filter:
            title: "Selecciona un media del listado o sube un nuevo archivo"
    list:
        meta.title: "Medias"
        title: "Medias"
        breadcrumb: "Medias"
        empty:
            no_types_configured:
                message_raw: "No se han configurado tipos de media"
                go_to_doc_raw: "Comprueba cómo configurar los tipos de media en la <a href=\"https://github.com/softspring/media-bundle\" target=\"_blank\">documentación</a>"
            create_first_raw: "Aún no se ha subido ningún archivo, pulsa en el botón \"Nuevo archivo\" para subir uno."
            clean_filters_raw: "No se han encontrado resultados, intenta ser menos restrictivo."
        actions:
            create.link: "Nuevo archivo"
        filter_form:
            text:
                label: "Texto"
                placeholder: "Introduce el texto a buscar"
            name:
                label: "Nombre"
                placeholder: "Introduce el nombre"
            type:
                label: "Tipo de media"
                placeholder: "Selecciona el tipo"
            no_content_entity:
                label: "No utilizada en contenidos"
            with_duplicates:
                label: "Con duplicados"
            content_entity:
                label: "Contenido"
                placeholder: "Selecciona el contenido"
            order_field:
                name: "Nombre"
                createdAt: "Fecha de creación"
            ordir_field:
                asc: "Ascendente"
                desc: "Descendente"

    create:
        meta.title: "%type%"
        title: "%type%"
        breadcrumb: "Añadir nuevo archivo"
        form_title: "Añadir nuevo archivo"
        actions:
            create.button: "Subir archivo"
            cancel.button: "Cancelar"
            upload.button: "Selecciona archivo principal"

    read:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Detalles"
        actions:
            update.button: "Editar media"
            delete.button: "Borrar media"
            migrate.button: "Migrar configuración"

    delete:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Eliminar media"
        message: "¿Estás seguro que quieres borrar este media?"
        warning:
            title: "¿Estás seguro que quieres borrar este media?"
            text: "Los ficheros serán también eliminados. Ten en cuenta que si las URLs están direccionadas en algún sitio, los enlaces fallarán."
        actions:
            delete.button: "Eliminar media"
            cancel.button: "Cancelar"
        success_flash: "El media se ha eliminado correctamente."
        failure_flash: "Ha fallado la eliminación del media.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Ha fallado la eliminación del media.<br/><small>%exception%</small><br/><small>%previous%</small>"

    update:
        meta.title: "%name%"
        title: "%name%"
        breadcrumb: "Update media"
        actions:
            update.button: "Save changes"
            cancel.button: "Cancel"
            delete.button: "Delete"
        success_flash: "Media updated successfully"
        failure_flash: "Media update failed.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Media update failed.<br/><small>%exception%</small><br/><small>%previous%</small>"

    migrate:
        success_flash: "Media migrated successfully"
        failure_flash: "Media migration failed.<br/><small>%exception%</small><br/><small>%previous%</small>"
        exception_flash: "Media migration failed.<br/><small>%exception%</small><br/><small>%previous%</small>"

    form:
        name.label: "Nombre de la archivo"
        description.label: "Descripción"
        altTexts.label: "Textos alternativos"
        _original.label: "Archivo principal"
        upload.label: "Fichero"
        instructions: "Arrastra y suelta tu archivo aquí o súbelo usando el botón."
        button: "Seleccionar archivo"
        upload_requirements:
            title: "Requisitos"
            minWidth: "ancho mínimo %value%"
            maxWidth: "ancho máximo %value%"
            minHeight: "alto mínimo %value%"
            maxHeight: "alto máximo %value%"
            mimeTypes: "formatos %value% permitidos"
            maxSize: "tamaño máximo de fichero %value%"
            binaryFormat.true: "formato binario permitido"
            binaryFormat.false: "formato binario no permitido"
            allowSquare.true: "archivo cuadrada permitida"
            allowSquare.false: "archivo cuadrada no permitida"
            allowLandscape.true: "archivo horizontal permitida"
            allowLandscape.false: "archivo horizontal no permitida"
            allowPortrait.true: "archivo vertical permitida"
            allowPortrait.false: "archivo vertical no permitida"

    alerts:
        media_new_versions_raw: "La versión <strong>%version%</strong> de este media no existe, parece ser una <strong>nueva versión</strong> en la configuración. Debes ejecutar el comando de migración de medias."
        media_delete_versions_raw: "La versión <strong>%version%</strong> de este media ha sido <strong>eliminada</strong> en la configuración. Debes ejecutar el comando de migración de medias para limpiar los medias."
        media_changed_versions_raw: "La configuración de la versión <strong>%version%</strong> ha sido <strong>cambiada</strong> (%change_list%). Debes ejecutar el comando de migración de medias para limpiar los medias."
        media_manual_versions_raw: "Falta la versión <strong>%version%</strong> de este media, parece ser una <strong>nueva versión</strong> en la configuración. Es obligatorio que proporciones este archivo manualmente."
        media_duplicates_raw: "%duplicates% duplicados de este media. <a href=\"%url%\">Ver lista</a>"
        total_duplicates_raw: "Hay %different% medias con algunos duplicados. Un total de %total% medias están afectados, por lo tanto hay %duplicates% medias que potencialmente están duplicados y pueden ser eliminados."
